[project]
name = "iphone-observer"
version = "0.1.0"
description = "Collector sidecar: observabilite live d'un iPhone (sysmontap, diagnostics, syslog, reseau) via pymobiledevice3."
requires-python = ">=3.14"
dependencies = [
    "pymobiledevice3>=9.15.1",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
]

# Note licence: pymobiledevice3 est GPL-3.0. Ce package est le sidecar "moteur",
# invoque en process separe (CLI / WebSocket). L'UI native de la phase 2 ne doit
# jamais importer ni linker ce package: elle parle au collector via WebSocket.

[project.scripts]
iphone-observer = "iphone_observer.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iphone_observer"]
